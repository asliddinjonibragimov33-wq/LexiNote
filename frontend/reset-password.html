<!DOCTYPE html>
<html lang="uz">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yangi parol - LexiNote</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>
    <main class="auth-container">
        <div class="auth-card">
            <h1>LexiNote</h1>
            <h2>Yangi parol o‘rnating</h2>

            <p class="auth-description">
                Hisobingiz uchun yangi parol
                yarating.
            </p>

            <form id="reset-password-form">

                <!-- YANGI PAROL -->
                <div class="form-group">
                    <label for="new-password">
                        Yangi parol
                    </label>
                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        placeholder="Yangi parolingizni kiriting"
                        minlength="6"
                        required
                    >
                </div>

                <!-- PAROLNI TASDIQLASH -->
                <div class="form-group">
                    <label for="confirm-password">
                        Parolni tasdiqlang
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Parolni qayta kiriting"
                        minlength="6"
                        required
                    >
                </div>

                <!-- XABAR -->
                <p
                    id="reset-message"
                    class="auth-message"
                ></p>

                <!-- SAQLASH -->
                <button type="submit">
                    Yangi parolni saqlash
                </button>
            </form>

            <p class="auth-footer">
                Parolingiz esingizga tushdimi?
                <a href="login.html">
                    Kirish
                </a>
            </p>
        </div>
    </main>

    <script src="js/reset-password.js"></script>
</body>
</html>
