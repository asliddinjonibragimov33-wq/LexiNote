<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - LexiNote</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth-container">
        <div class="auth-card">
            <h1>LexiNote</h1>
            <h2>Hisob yaratish</h2>
            <p class="auth-description">Shaxsiy lug‘at hisob qaydnomangizni yarating.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Ism</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ismingizni kiriting"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contact">Email</label>
                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="Emailingizni kiriting"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Login</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Login yarating"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Parol</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Parol yarating"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Parolni tasdiqlang</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Parolni tasdiqlang"
                        required
                    >
                </div>
                <button type="submit">Davom etish</button>
            </form>

            <p class="auth-footer">Hisobingiz bormi?<a href="login.html">Kirish</a></p>
        </div>
    </main>
    <script src="js/register.js"></script>
</body>
</html>
